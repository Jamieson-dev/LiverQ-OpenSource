name: Bug report
description: Report something in the app or code that is broken or behaving incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** include patient-identifiable
        information. For security or privacy issues, do not file a public issue —
        see SECURITY.md and email jamie.son.apps@gmail.com instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I ..., the app ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / browser
      description: e.g. iPhone 14, Safari 17 / Desktop Chrome 120
    validations:
      required: false
  - type: input
    id: url-or-build
    attributes:
      label: URL or build
      description: e.g. a local dev build, or your own deployment
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or additional context
      description: Optional. Do not include any patient-identifiable information.
    validations:
      required: false
