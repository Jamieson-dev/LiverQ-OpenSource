name: Feature request
description: Suggest a new feature or improvement (not a medical-content change).
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for app/code/UX ideas. To propose or correct **medical content**
        (questions, answers, explanations), please use the "Medical content
        correction" template instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or the pain point.
      placeholder: It is hard to ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches you thought about.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI / UX
        - Quiz logic
        - Accessibility
        - Translation / localization
        - Documentation
        - Build / tooling
        - Other
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Mockups, links, or examples.
    validations:
      required: false
